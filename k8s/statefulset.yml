apiVersion: v1
kind: Service
metadata:
  name: test-app
  labels:
    app: app-python
spec:
  ports:
  - port: 80
    name: web
  clusterIP: None
  selector:
    app: app-python
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-python
spec:
  serviceName: "test-app"
  replicas: 3
  selector:
    matchLabels:
      app: app-python
  template:
    metadata:
      labels:
        app: app-python
    spec:
      containers:
        - name: app-python
          image: atkond/flask-app:latest
          ports:
            - containerPort: 5000 
